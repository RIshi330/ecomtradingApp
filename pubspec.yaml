name: trading_ecommerce_admin
description: Premium Marketplace Product Detail Screen

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.2

  # State Management
  provider: ^6.1.5

  # Network Images
  cached_network_image: ^3.4.1

  # Product Gallery
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1

  # Image Zoom
  photo_view: ^0.15.0

  # Ratings
  flutter_rating_bar: ^4.0.1

  # Share Product
  share_plus: ^11.1.0

  # Currency / Number Formatting
  intl: ^0.20.2

  # Animations
  animations: ^2.0.11

  # Shimmer Loading
  shimmer: ^3.0.0

  # Toast Notifications
  fluttertoast: ^8.2.12

  # Launch URLs
  url_launcher: ^6.3.2

  # Image Upload for Reviews
  image_picker: ^1.2.0

  # Local Storage
  shared_preferences: ^2.5.3

  # SVG Icons
  flutter_svg: ^2.2.0

  # HTTP APIs
  http: ^1.5.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # Razorpay Payment Gateway
  razorpay_flutter: ^1.3.7

  # Permission Handling
  permission_handler: ^12.0.1

  # Geolocator & Geocoding
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  file_picker: ^11.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # assets and fonts removed temporarily - add back when files are ready